<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <header><a href="/" class="logo">videy</a></header>
        <main>
            <div style="max-width:900px;width:100%;display:flex;justify-content:center;">
                <video id="player" controls autoplay playsinline loop style="width:100%;max-height:85vh;background:#000;border-radius:6px;"></video>
            </div>
        </main>
    </div>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        if (id) { document.getElementById('player').src = `/v/${id}.mp4`; }
        else { document.body.innerHTML = '<h3>Invalid ID</h3>'; }
    </script>
</body>
</html>
